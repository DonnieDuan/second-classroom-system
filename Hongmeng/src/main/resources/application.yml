server:
  port: 8080
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    connection-timeout: 30000
  servlet:
    context-path: /second-class

spring:
  application:
    name: second-class-score-system

  # ????? (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/secscore?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000
      pool-name: SecondClassHikariPool

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # Cache (uses in-memory ConcurrentHashMap instead of Redis)
  cache:
    type: simple

  # Redis (disabled — use spring.cache.type=simple instead)
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      password:
#      database: 0
#      timeout: 5000ms
#      lettuce:
#        pool:
#          max-active: 200
#          max-idle: 50
#          min-idle: 10
#          max-wait: 2000ms

  # ??????
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
      enabled: true
      location: /tmp/uploads

  # Spring Security ????
  security:
    user:
      name: admin
      password: admin123

  main:
    allow-circular-references: true

# MyBatis??
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: edu.ynjgy.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    default-executor-type: reuse

# ????
logging:
  level:
    edu.ynjgy.mapper: debug
    org.springframework.web: info
    org.springframework.security: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/second-class.log
    max-size: 10MB
    max-history: 30

# ???????
app:
  score-rules:
    competition:
      national-first: 90
      national-second: 85
      provincial-first: 80
      provincial-second: 75
      school-first: 70
    certificate:
      advanced: 85
      intermediate: 75
      primary: 65
  warning-threshold: 60
  upload-path: /data/uploads/certificates
