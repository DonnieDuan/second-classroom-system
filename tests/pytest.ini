[pytest]
# 测试用例路径
testpaths = api ui

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志输出格式
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 输出详细程度
verbosity = 2

# 禁止递归循环
norecursedirs = .git .pytest_cache __pycache__ reports

# 标记
markers =
    slow: 标记为耗时较长的测试用例
    smoke: 冒烟测试，核心功能
    auth: 认证相关测试
    score: 成绩管理相关测试
    event: 赛事管理相关测试
    student: 学生管理相关测试
    org: 机构管理相关测试
    ui: UI自动化测试
    api: 接口自动化测试
